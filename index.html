  HURTIG VIDERESTILLING (3/10): GitHub Pages kan ikke sende en 301 fra

  ændres et eneste tegn i det, skal hashen regnes om:
    node -e "console.log(require('crypto').createHash('sha256').update(SCRIPTET).digest('base64'))"
  Meta refresh og <noscript>-linket er reserve uden JavaScript.

  ARYTMI.COM SENDER VIDERE TIL FUNNELEN - 3. oktober 2026.

  Oliivia og Kennet 3/10: ingen hjemmeside, kun funnels. Skriver man
  arytmi.com, lander man i toppen af funnelen på afsted.arytmi.com
  (hed shop.arytmi.com indtil 3/10, som ClickFunnels selv sender videre).

  KUN FORSIDEN sender videre. Domænet må ALDRIG peges på ClickFunnels:
  /aktiver, /nulstil, /os, /liste, /admin (og senere /privatliv) bor her
  og skal blive ved med at virke.

  SAMME ADRESSE står i shop.html (arytmi.com/shop). Skiftes funnelen, rettes
  begge - to steder i hver fil: <meta http-equiv="refresh"> og linket nederst.

  DEN BYGGEDE FORSIDE er gemt i git-historikken: commit cb59f6c (og 3fed676
  med /shop til toppen af funnelen). Hent den frem med
      git checkout 3fed676 -- index.html
  Billederne i billeder/ og skrifterne i fonts/ er bevaret til det formål -
  slet dem ikke.

  ⚠️ APPLE 3.1.1: appens "Opret en konto" peger på arytmi.com og lander nu

  og:-felterne bliver her, så et delt link til arytmi.com stadig viser et
