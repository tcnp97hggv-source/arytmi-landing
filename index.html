<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8">
<!--
  INDHOLDSPOLITIK (CSP). Tilføjet 11. september 2026.

  Den siger, hvad browseren OVERHOVEDET må hente på den her side. Alt er
  `none` som udgangspunkt, og så åbnes der præcis det, siden bruger:

    style-src 'self' 'unsafe-inline'    sidens eget <style>, som står inline.
    img-src 'self'                      logo, bil og favicons. Alle herfra.

  Siden har intet script og taler ikke med nogen server, så der er hverken
  script-src eller connect-src. Kommer der et script her en dag, siger
  browserkonsollen fra med det samme.
    base-uri 'none'      ingen kan skyde et <base>-tag ind og flytte
                         alle relative adresser et andet sted hen.
    form-action 'none'   formularerne herinde sendes af JavaScript, som
                         altid kalder preventDefault(). Uden den linje
                         ville en formular uden JavaScript submitte til
                         sig selv med GET - og på aktiver- og
                         nulstil-siderne ville kodeordet så stå i
                         adresselinjen og i browserhistorikken.

  HVORFOR ET <meta>-TAG OG IKKE EN HTTP-HEADER: siderne udgives af GitHub
  Pages, som ikke kan sætte headers. Prisen er, at `frame-ancestors` og
  `report-uri` IKKE virker i et meta-tag - de ignoreres. Siderne kan
  altså stadig lægges i en iframe af en fremmed. Skal det lukkes, kræver
  det en vært, der kan sætte headers (Cloudflare Pages, Netlify).

  HVORFOR 'unsafe-inline' OG IKKE HASHES: al CSS og JavaScript står inline
  i filen, og hashes ville være strengere. De ville også betyde, at siden
  holder op med at virke, hver gang nogen retter et komma i scriptet og
  glemmer at regne hashen om - lydløst, uden fejl på skærmen. På en side,
  hvor en kunde aktiverer sin konto, er det den dyreste slags fælde.
  Beskyttelsen mod indsprøjtet HTML ligger et andet sted, og den er reel:
  siderne skriver ALTID med textContent, aldrig innerHTML.

  ⚠️ `connect-src` peger på Supabase-projektets adresse. Skiftes projektet
  - fx ved en genskabelse fra backup - skal den her linje med. Ellers kan
  siden ikke tale med serveren, og fejlen står kun i browserkonsollen.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arytmi — kommer snart</title>
<meta name="description" content="Arytmi. En ny måde at planlægge de små, spontane ture på. Kommer snart.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<style>
  @charset "UTF-8";
  /* Ny udgave 27/9 2026: appens palette, logo og signaturbil, så siden ser
     ud som appen. Farverne er Oliivias palette (samme som app.css); de
     afledte (dæmpet tekst, streger) er brun blandet i creme, som i appen. */
  :root{
    --brun:#4a2417;          /* Deep Brown */
    --creme:#f7efe4;         /* Warm Cream */
    --sand:#e9ddcf;          /* Soft Sand */
    --rust:#8e4333;          /* Warm Rust Red — 5,2:1 på sand */
    --cta:#e8935a;           /* CTA Orange */
    --daempet:#6f5245;       /* brun i creme — 5,9:1 på creme */
    --linje:rgba(74,36,23,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--creme);
    color:var(--brun);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    position:relative;
    overflow:hidden;
    padding:24px 24px 120px;
  }
  /* Landskabet fra appens baggrund (.app-baggrund i appens index.html):
     varm hvisken øverst, bakker og to træer nederst. */
  .landskab{position:absolute;inset:0;pointer-events:none;z-index:0}
  .landskab::before{content:'';position:absolute;top:0;left:0;right:0;height:360px;
    background:linear-gradient(to bottom,rgba(232,147,90,.14),rgba(232,147,90,.04) 52%,transparent)}
  .landskab svg{position:absolute;bottom:0;left:0;width:100%;height:200px}
  /* Signaturbilen som stregtegning — den ægte illustration kørt gennem
     brand/lav-stregtegning.py i app-repoet. Står på bakkerne, bag dem. */
  .bil{
    position:absolute;
    bottom:34px;
    right:max(-30px, calc(50% - 460px));
    width:min(64vw,420px);
    opacity:.2;
    pointer-events:none;
  }
  .indhold{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:420px;
  }
  .logo{
    width:min(240px,62vw);
    height:auto;
    margin:0 auto 30px;
    display:block;
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  p.lead{
    font-size:16px;
    line-height:1.6;
    color:var(--daempet);
    margin-bottom:32px;
  }
  .etiket{
    display:inline-block;
    font-size:11px;
    letter-spacing:2.4px;
    text-transform:uppercase;
    color:var(--rust);
    font-weight:700;
    border:1px solid var(--linje);
    border-radius:20px;
    padding:8px 18px;
    background:var(--sand);
  }
  footer{
    position:absolute;
    bottom:22px;
    left:0;
    right:0;
    text-align:center;
    font-size:13px;
    color:var(--daempet);
    z-index:1;
  }
  footer a{
    color:var(--brun);
    text-decoration:none;
    border-bottom:1px solid var(--cta);
  }
</style>
</head>
<body>
  <div class="landskab" aria-hidden="true">
    <img class="bil" src="signaturbil-streg.png" alt="">
    <svg viewBox="0 0 430 170" preserveAspectRatio="none">
      <path d="M0 54 C60 30 120 44 180 36 C250 27 300 50 350 40 C390 33 415 40 430 36 V170 H0 Z" fill="#4a2417" opacity=".05"/>
      <path d="M0 88 C70 68 130 84 200 74 C280 63 330 86 430 70 V170 H0 Z" fill="#4a2417" opacity=".07"/>
      <path d="M0 126 C90 110 180 126 270 118 C340 112 400 122 430 116 V170 H0 Z" fill="#4a2417" opacity=".09"/>
      <g fill="#4a2417" opacity=".08">
        <path d="m36 92 8-16 8 16zM38 79l6-12 6 12z"/>
        <path d="m388 84 7-14 7 14zM390 73l5-10 5 10z"/>
      </g>
    </svg>
  </div>
  <div class="indhold">
    <h1 class="sr-only">Arytmi</h1>
    <img class="logo" src="logo-2026.svg" alt="Arytmi">
    <p class="lead">En ny måde at planlægge de små, spontane ture på — væk fra hverdagen, uden at det kræver en hel ferie.</p>
    <span class="etiket">Kommer snart</span>
  </div>
  <footer>Spørgsmål? Skriv til <a href="mailto:kundeservice@arytmi.com">kundeservice@arytmi.com</a></footer>
</body>
</html>
