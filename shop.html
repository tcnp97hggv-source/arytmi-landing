<!--
  VIDERESTILLINGEN TIL SHOPPEN — arytmi.com/shop. 3. oktober 2026.

  Det her er det ENESTE sted, der siger, hvilken funnel forsiden sender
  kunderne til. Alle knapper på forsiden peger på `shop`. Skifter I tema
  (efterårsferie, jul, ...), rettes adressen her - to steder: i
  <meta http-equiv="refresh"> og i linket nederst. Forsiden røres ikke.

  NU: toppen af salgssiden (Kennet 3/10). Funnelen skifter tema, og temaet
  står i dens top - så kunden skal se den. (Før sprang vi ned til "DET FÅR
  DU" med #whatyouget for at undgå to historier i træk; det mistede temaet
  og var skrøbeligt, fordi ankeret forsvinder lydløst, hvis sektionen
  omdøbes i ClickFunnels.)

  Adressen kan også bruges for sig, fx på tryk og i opslag: arytmi.com/shop.
  INGEN pris og intet købsord her heller - appen linker til forsiden.
-->
